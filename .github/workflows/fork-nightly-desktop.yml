name: Build Nightly Desktop Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Nightly version to embed in the installers
        type: string
        required: true
        default: "0.1.12-nightly.20261124.5209"

concurrency:
  group: fork-nightly-desktop-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VP_REMOTE_CACHE: "off"
  T3_TASK_CACHE_TELEMETRY: "off"

jobs:
  prepare:
    if: github.repository == 'xuanhen2013/t3code' && github.ref == 'refs/heads/no-telemetry-nightly'
    name: Resolve Nightly source and public Connect config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.config.outputs.sha }}
      version: ${{ steps.config.outputs.version }}
      clerk_publishable_key: ${{ steps.config.outputs.T3CODE_CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ steps.config.outputs.T3CODE_CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ steps.config.outputs.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ steps.config.outputs.T3CODE_RELAY_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/drop-checkout-credentials

      - name: Pin the source commit and read public settings
        id: config
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            echo 'Expected a Nightly version in the form 0.1.12-nightly.YYYYMMDD.NNNN.' >&2
            exit 1
          fi
          printf 'sha=%s\nversion=%s\n' "$(git rev-parse HEAD)" "$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { parseEnv } from "node:util";

          const config = parseEnv(readFileSync(".env.example", "utf8"));
          const keys = [
            "T3CODE_CLERK_PUBLISHABLE_KEY",
            "T3CODE_CLERK_JWT_TEMPLATE",
            "T3CODE_CLERK_CLI_OAUTH_CLIENT_ID",
            "T3CODE_RELAY_URL",
          ];
          for (const key of keys) {
            const value = config[key]?.trim();
            if (!value || /[\r\n]/.test(value)) throw new Error(`Missing or invalid ${key} in .env.example`);
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

  wsl-runtime:
    name: Build Linux x64 runtime for WSL
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.prepare.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.prepare.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.prepare.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.prepare.outputs.relay_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/drop-checkout-credentials

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Build and smoke-test the WSL runtime
        run: |
          node scripts/update-release-package-versions.ts "$BUILD_VERSION"
          vp run --filter t3 build
          node apps/server/scripts/cli.ts build-exe --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p cli-resource-monitor/linux-x64
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor cli-resource-monitor/linux-x64/
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$BUILD_VERSION" --resource-monitor-dir cli-resource-monitor
          node scripts/smoke-cli-archive.ts --archive "release-cli/t3-$BUILD_VERSION-linux-x64.tar.gz" --expect-version "$BUILD_VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-runtime-linux-x64
          path: release-cli/t3-*-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  desktop:
    name: Package ${{ matrix.label }}
    needs: [prepare, wsl-runtime]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            runner: macos-26
            platform: mac
            arch: arm64
            rust-target: aarch64-apple-darwin
            target: dmg
            extension: dmg
          - label: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
            rust-target: x86_64-pc-windows-msvc
            target: nsis
            extension: exe
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.prepare.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.prepare.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.prepare.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.prepare.outputs.relay_url }}
      T3CODE_DESKTOP_SIGNED: "false"
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Enable long paths for Git
        if: matrix.platform == 'win'
        run: git config --global core.longpaths true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/drop-checkout-credentials

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Download WSL runtime
        if: matrix.platform == 'win'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wsl-runtime-linux-x64
          path: wsl-runtime

      - name: Build installer
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          INSTALLER_TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust-target }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          args=(--platform "$TARGET_PLATFORM" --arch "$TARGET_ARCH" --target "$INSTALLER_TARGET" --build-version "$BUILD_VERSION" --output-dir installers --verbose)
          if [[ "$TARGET_PLATFORM" == win ]]; then
            cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "$RUST_TARGET"
            export T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR=true
            # Official cross-builds omit this cache. Keep the native build within the same file budget.
            export T3CODE_DESKTOP_SKIP_SERVER_COMPILE_CACHE=true
            args+=(--wsl-runtime "wsl-runtime/t3-$BUILD_VERSION-linux-x64.tar.gz")
          fi
          if [[ "$TARGET_PLATFORM" == mac && -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            key_path="$(mktemp "$RUNNER_TEMP/t3-apple-key.XXXXXX")"
            trap 'rm -f "$key_path"' EXIT
            (umask 077 && printf '%s' "$APPLE_API_KEY" > "$key_path")
            export APPLE_API_KEY="$key_path"
            args+=(--signed)
          fi
          vp run dist:desktop:artifact "${args[@]}"
          mkdir -p release-assets
          cp installers/*."${{ matrix.extension }}" release-assets/
          if [[ "$TARGET_PLATFORM" == win ]]; then
            cp installers/nightly.yml installers/*.exe.blockmap release-assets/
          elif [[ " ${args[*]} " == *" --signed "* ]]; then
            cp installers/nightly-mac.yml installers/*.zip installers/*.zip.blockmap release-assets/
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3-code-nightly-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish fork Nightly and update files
    needs: [prepare, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: t3-code-nightly-*
          merge-multiple: true
          path: release-assets

      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd release-assets
          test -s nightly.yml
          tag="v$BUILD_VERSION"
          gh release create "$tag" ./* --target "$SOURCE_SHA" --draft --prerelease --latest=false \
            --title "T3 Code Fork $BUILD_VERSION" --notes "Desktop Nightly built from $SOURCE_SHA."
          gh release edit "$tag" --draft=false
